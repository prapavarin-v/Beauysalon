<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdf2f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #db2777 !important; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #db2777; border: none; }
        .btn-primary:hover { background-color: #be185d; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">💅 BeautySalon Booking</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4">
                <h4 class="mb-3">จองคิวใหม่</h4>
    
                <div class="mb-3">
                    <label class="form-label">ชื่อ</label>
                    <input type="text" id="firstname" class="form-control" placeholder="กรอกชื่อ">
                </div>

                <div class="mb-3">
                    <label class="form-label">นามสกุล</label>
                    <input type="text" id="lastname" class="form-control" placeholder="กรอกนามสกุล">
                </div>
                <div class="mb-3">
                    <label class="form-label">เบอร์โทรศัพท์</label>
                    <input type="text" id="phone" class="form-control" placeholder="08x-xxxxxxx">
                </div>
                <div class="mb-3">
                    <label class="form-label">เลือกบริการ</label>
                    <select id="serviceSelect" class="form-select">
                        <option value="">-- เลือกบริการ --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">วันที่</label>
                    <input type="date" id="bookDate" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">เวลา</label>
                    <input type="time" id="bookTime" class="form-control">
                </div>
                <button onclick="makeBooking()" class="btn btn-primary w-100">ยืนยันการจอง</button>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>ตารางนัดหมายรายวัน</h4>
                    <input type="date" id="filterDate" class="form-control w-50" onchange="loadBookings()">
                </div>
                <div id="bookingList" class="row">
                    </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8000';

    // 1. โหลดบริการมาใส่ใน Select
    function loadServices() {
        fetch(`${API_URL}/services`)
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('serviceSelect');
                let options = '<option value="">-- เลือกบริการ --</option>';
                options += data.map(s => `<option value="${s.id}">${s.service_name} (${s.price}.-)</option>`).join('');
                select.innerHTML = options;
            })
            .catch(err => console.error("Error loading services:", err));
    }

    // 2. ฟังก์ชันจองคิว พร้อม CHECK ค่าว่าง
    function makeBooking() {
        // ดึงค่าจากหน้าจอ
        const firstname = document.getElementById('firstname').value.trim();
        const serviceId = document.getElementById('serviceSelect').value;
        const date = document.getElementById('bookDate').value;
        const time = document.getElementById('bookTime').value;

        // --- ส่วนตรวจสอบข้อมูล (Validation) ---
        if (!firstname) { alert("กรุณากรอกชื่อผู้จอง"); return; }
        if (!serviceId) { alert("กรุณาเลือกบริการ"); return; }
        if (!date) { alert("กรุณาเลือกวันที่"); return; }
        if (!time) { alert("กรุณาเลือกเวลา"); return; }
        // ----------------------------------

        const bodyData = {
            user_id: 1, // สมมติค่าไว้ก่อน
            service_id: serviceId,
            booking_date: date,
            booking_time: time
        };

        fetch(`${API_URL}/booking`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            // ล้างค่าหลังจองเสร็จ
            document.getElementById('bookDate').value = "";
            document.getElementById('bookTime').value = "";
            loadBookings(); // รีเฟรชตาราง
        })
        .catch(err => alert("เกิดข้อผิดพลาดในการบันทึก"));
    }

    // 3. ดึงรายการนัดหมาย
    function loadBookings() {
        const date = document.getElementById('filterDate').value;
        if (!date) return;

        fetch(`${API_URL}/admin/bookings/${date}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('bookingList');
                if (!data.length) {
                    list.innerHTML = '<p class="text-center text-muted">ไม่มีนัดหมายในวันนี้</p>';
                    return;
                }
                list.innerHTML = data.map(item => `
                    <div class="col-md-6 mb-3">
                        <div class="card p-3 border-start border-info border-5">
                            <h6>👤 ${item.fullname}</h6>
                            <p class="mb-1 text-muted">💇 ${item.service_name}</p>
                            <p class="mb-2 text-primary">⏰ ${item.booking_time} น.</p>
                            <button onclick="cancelBooking(${item.id})" class="btn btn-outline-danger btn-sm">ยกเลิกนัด</button>
                        </div>
                    </div>
                `).join('');
            });
    }

    // 4. ยกเลิกนัด
    function cancelBooking(id) {
        if (confirm('ยืนยันการลบนัดหมายนี้?')) {
            fetch(`${API_URL}/booking/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadBookings();
                });
        }
    }

    // รันตอนโหลดหน้าเว็บครั้งแรก
    window.onload = () => {
        loadServices();
        document.getElementById('filterDate').valueAsDate = new Date();
        loadBookings();
    };
</script>

</body>
</html>
