<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองคิว | Premium Salon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="statusToast" class="status-toast" style="display:none; position:fixed; top:20px; right:20px; padding:1rem; border-radius:12px; color:white; z-index:9999;"></div>

    <nav class="navbar mb-5 shadow-sm">
        <div class="container justify-content-center">
            <span class="navbar-brand"><i class="fa-solid fa-crown me-2"></i> Premium Salon</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card p-4 shadow-lg border-0">
                    <h4 class="mb-4 fw-bold text-center" style="color: var(--rose-gold-deep);"><i class="fa-solid fa-calendar-plus me-2"></i>จองคิวใช้บริการ</h4>
                    <div class="row g-3">
                        <div class="col-6"><label class="form-label">ชื่อ</label><input type="text" id="firstname" class="form-control" placeholder="ชื่อ"></div>
                        <div class="col-6"><label class="form-label">นามสกุล</label><input type="text" id="lastname" class="form-control" placeholder="นามสกุล"></div>
                        <div class="col-12"><label class="form-label">เบอร์โทรศัพท์</label><input type="text" id="phone" class="form-control" placeholder="08x-xxxxxxx"></div>
                        <div class="col-12"><label class="form-label">บริการที่ต้องการ</label><select id="serviceSelect" class="form-select"></select></div>
                        <div class="col-6"><label class="form-label">วันที่</label><input type="date" id="bookDate" class="form-control"></div>
                        <div class="col-6"><label class="form-label">เวลา</label><input type="time" id="bookTime" class="form-control"></div>
                    </div>
                    <button onclick="makeBooking()" class="btn btn-primary w-100 mt-4 py-3 fw-bold">ยืนยันการจองคิว</button>
                    <div class="text-center mt-3"><a href="schedule.html" class="text-muted small text-decoration-none"><i class="fa-solid fa-list me-1"></i> ดูตารางคิวจอง</a></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        function showToast(msg, type='success', targetDate = null) {
            const t = document.getElementById('statusToast');
            t.innerText = msg;
            t.style.background = type === 'success' ? '#10b981' : '#ef4444';
            t.style.display = 'block'; 
            setTimeout(() => {
                t.style.display = 'none';
                // ถ้าจองสำเร็จ ให้เด้งไปหน้าตารางคิว พร้อมระบุวันที่จอง
                if(type === 'success' && targetDate) {
                    window.location.href = `schedule.html?date=${targetDate}`;
                } else if (msg.includes('สำเร็จ')) {
                    window.location.href = 'schedule.html';
                }
            }, 2000);
        }

        function loadServices() {
            fetch(`${API_URL}/services`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('serviceSelect').innerHTML = '<option value="">-- เลือกบริการ --</option>' + 
                    data.map(s => `<option value="${s.id}">${s.service_name} (${s.price}.-)</option>`).join('');
                })
                .catch(err => console.error("Error loading services:", err));
        }

        function makeBooking() {
            const selectedDate = document.getElementById('bookDate').value;
            const data = {
                firstname: document.getElementById('firstname').value, 
                lastname: document.getElementById('lastname').value,
                phone: document.getElementById('phone').value, 
                service_id: document.getElementById('serviceSelect').value,
                booking_date: selectedDate, 
                booking_time: document.getElementById('bookTime').value
            };

            if(!data.firstname || !data.service_id || !data.booking_date || !data.booking_time) {
                showToast("กรุณากรอกข้อมูลให้ครบถ้วน", "error");
                return;
            }

            fetch(`${API_URL}/booking`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(data) 
            })
            .then(res => res.json())
            .then(d => { 
                const isSuccess = d.message.includes('สำเร็จ');
                showToast(d.message, isSuccess ? 'success' : 'error', isSuccess ? selectedDate : null); 
            })
            .catch(err => {
                showToast("ไม่สามารถติดต่อเซิร์ฟเวอร์ได้", "error");
            });
        }

        window.onload = () => { 
            loadServices(); 
            document.getElementById('bookDate').value = new Date().toISOString().split('T')[0]; 
        };
    </script>
</body>
</html>
