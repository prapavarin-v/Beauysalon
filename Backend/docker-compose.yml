version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: salon_db_server
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: beauty_password_2026  
      MYSQL_DATABASE: beauty_salon_db
    ports: 
      - "8821:3306"
    volumes:
      - salon_data_storage:/var/lib/mysql
    networks:
      - salon_network
    restart: always

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: salon_admin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: beauty_password_2026 
      UPLOAD_LIMIT: 64M
    ports:
      - "8822:80"
    depends_on: 
      - db
    networks:
      - salon_network
    restart: always

networks:
  salon_network:
    driver: bridge

volumes:
  salon_data_storage: 
    driver: local